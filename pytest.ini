[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -v --html=reports/automation-report.html --self-contained-html
markers =
    smoke: Smoke testing suite
    regression: Full regression test suite
    auth: Authentication and registration tests
    catalog: Product catalog and search tests
    cart: Shopping cart and checkout tests
